name: Frontend Quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up PHP
        # Pin to the production runtime so `php -l` / PHPCS validate against the
        # same PHP version the site runs on (Hostinger / Docker = PHP 8.2), not
        # whatever the runner ships by default.
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install Node dependencies
        run: npm ci

      - name: Lint frontend and PHP
        run: |
          chmod +x bin/lint-phpcs.sh
          npm run lint

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Bootstrap WordPress
        run: |
          chmod +x bin/bootstrap-wordpress.sh
          ./bin/bootstrap-wordpress.sh

      - name: Report route-shim drift
        # The committed series/speaker/pagination shims are a hand-maintained
        # snapshot of published URLs, and the weekly sermon cron makes them go
        # stale silently — nothing else reports that. Advisory only: CI seeds
        # fixture sermons that legitimately have no committed shim, so a failure
        # here would mean "the seed ran", not "production drifted". Read the log
        # when you change sermon, series, or speaker content.
        continue-on-error: true
        run: |
          docker compose run --rm -T -v "$PWD":/repo wpcli \
            church-core regenerate-shims --check --root=/repo

      - name: Run PHP tests
        run: |
          chmod +x bin/test-php.sh
          npm run test:php

      - name: Run Playwright smoke tests
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8080
        run: npm run test:smoke
